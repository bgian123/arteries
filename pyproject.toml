[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arteries"
version = "0.1.0"
description = "Lowest-cost multimodal (road + sea) distances between world cities on a global transport network"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Blaize Giangiulio"}]
dependencies = ["numpy>=1.22", "scipy>=1.8", "pandas>=1.4"]
keywords = ["trade", "gravity", "distance", "transport network", "shipping", "openstreetmap"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: GIS",
  "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
fast = ["numba>=0.57"]
build = ["numba>=0.57", "pyproj>=3.3"]
plot = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arteries = ["data/*.npz", "data/*.txt"]
