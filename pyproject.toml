[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arteries"
version = "0.1.0"
description = "Exact lowest-cost road + sea distances between the world's cities over a real infrastructure network"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Blaize Giangiulio"}]
dependencies = ["numpy>=1.22", "scipy>=1.8", "pandas>=1.4"]
keywords = ["trade", "gravity", "distance", "transport network", "shipping", "openstreetmap"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: GIS",
  "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://blaizegiangiulio.com"
Source = "https://github.com/bgian123/arteries"
Documentation = "https://github.com/bgian123/arteries/blob/main/docs/METHODS.md"
"Data release" = "https://github.com/bgian123/arteries/releases/tag/data-v0.1.0"

[project.optional-dependencies]
fast = ["numba>=0.57"]
build = ["numba>=0.57", "pyproj>=3.3"]
plot = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arteries = ["data/*.npz", "data/*.txt"]
