# Publishes arteries to PyPI whenever a GitHub release tagged v* is published.
# Uses PyPI "trusted publishing": no API token is stored anywhere.
# One-time setup on pypi.org: Account -> Publishing -> Add a new pending publisher
#   PyPI project name: arteries   Owner: bgian123   Repository: arteries
#   Workflow name: publish.yml    Environment: pypi
name: publish

on:
  release:
    types: [published]

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke test the wheel
        run: |
          python -m pip install dist/*.whl pytest numba pyproj
          python -c "import arteries; print(arteries.__version__)"
          python -m pytest -q tests
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
